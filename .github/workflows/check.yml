# mise run check (./eng/build.sh Check), full output in the job log. Its consumer behavior publishes
# NativeAOT package consumers, one of them running the generated DbCommand interceptor.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # NativeAOT links with clang (on the runner image) against zlib.
      - name: NativeAOT prerequisites
        run: dpkg -s zlib1g-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev; }

      - name: Check
        run: mise run check
        env:
          QYL_VERBOSE: 1
