- kind: instrumentation_option
  key: instrumentation_options.OTEL_DOTNET_AUTO_NPGSQL_CONTEXT_PROPAGATION
  environment_variable: OTEL_DOTNET_AUTO_NPGSQL_CONTEXT_PROPAGATION
  description: Whether the Npgsql instrumentation propagates the W3C traceparent to PostgreSQL through application_name for non-multiplexed commands and Npgsql 10 COPY operations.
  value_type: boolean
  default_value: "false"
  status: experimental
  target_signal: traces
  target_instrumentation_id: NPGSQL
  notes:
  - Propagation adds one SET application_name round trip before each traced operation and one RESET application_name cleanup round trip after it.
  - RESET does not restore a value assigned later with SET, so enabling this option can overwrite an application_name set by application code at runtime.
  - Multiplexing is not supported; the instrumentation skips propagation and logs one warning when it detects a multiplexed connector.
  index: 61
  contract_item_id: OTEL_DOTNET_AUTO_CONTRACT_061
  upstream_sources:
  - label: current config
    url: https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/blob/bb2d0ef0cfb64bbe0d9c88640848e4a92f263fd6/docs/config.md#L276-L339
