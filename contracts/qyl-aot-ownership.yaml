schema_id: qyl-aot-ownership
schema_version: 1.0.0
source_contract: contracts/otel-dotnet-auto.upstream.yaml
ownership_items:
- contract_item_id: OTEL_DOTNET_AUTO_CONTRACT_001
  key: signals.traces.ADONET
  lane: source_interceptor
  qyl_status: implemented
  call_site_visibility: user_code
  payload_access: not_applicable
  evidence_level: verified_nativeaot
  primary_owner: QylAutoInstrumentationGenerator
  evidence:
  - src/Qyl.Telemetry.AutoInstrumentation.SourceGenerators/QylAutoInstrumentationGenerator.cs
  - eng/build/ConsumerBehavior/SourceInterceptorConsumer.cs
  - demos/Qyl.RealAdoNetDemo
  - tests/Qyl.Telemetry.Integration.Tests/Lanes/AdoNetTests.cs
  conformance_signals:
  - kind: span
    name: adonet.command
    required_attributes:
    - db.system.name
    - db.operation.name
    - db.query.summary
    - qyl.instrumentation.domain
    recommended_attributes:
    - error.type
    opt_in_attributes:
    - db.query.text
- contract_item_id: OTEL_DOTNET_AUTO_CONTRACT_002
  key: signals.traces.ASPNET
  lane: unsupported_nativeaot
  qyl_status: unsupported_nativeaot
  call_site_visibility: user_code
  payload_access: reflection_required
  evidence_level: none
  primary_owner: unsupported by qyl NativeAOT substrate
  evidence: []
  unsupported_reason: 'Classic ASP.NET (System.Web MVC/WebApi) executes only on .NET Framework 4.x inside
    IIS; System.Web does not exist on .NET 10, so no in-process mechanism is available to this managed
    substrate. Devil''s-advocate check (2026-07-18): Microsoft.AspNetCore.SystemWebAdapters covers apps
    mid-migration to ASP.NET Core, not the literal promise; rejected as a rescue.'
