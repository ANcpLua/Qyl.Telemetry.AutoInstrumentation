  - tests/Qyl.Telemetry.Integration.Tests/Lanes/AspNetCoreTests.cs
  - tests/Qyl.Telemetry.Integration.Tests/Lanes/SessionPropagationTests.cs
  conformance_signals:
  - kind: span
    name: aspnetcore.server
    required_attributes:
    - http.request.method
    - http.response.status_code
    - http.route
    - qyl.instrumentation.domain
    - url.scheme
